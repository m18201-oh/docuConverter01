[project]
name = "docuconverter"
version = "0.1.0"
description = "PDF·HWP·HWPX·HML·EPUB·HTML → Markdown 변환 도구 모음"
requires-python = ">=3.10,<3.14"
dependencies = [
  "marker-pdf[full]>=1.10.1,<1.11",
  "ebooklib>=0.18",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "pypdfium2>=4.30",
  "pymupdf>=1.26",
  "pillow>=10.1,<11",
  "html2text>=2024.2",
  "torch",
]

[project.optional-dependencies]
hwp = ["pywin32>=306; sys_platform == 'win32'", "pyhwp>=0.1b15"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
